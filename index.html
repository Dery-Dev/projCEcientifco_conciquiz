<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConciQuiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
      <div class="cenario">
                                <!-- Tela inicial -->
         <div class="tela-inicial" id="telaInicial">
           <img src="logo ConciQuiz.png" class="titulo-jogo">
           <button id="botaoComecar">
            <img src="iniciar_conciQuiz.png" alt="iniciar"></button>
         </div>
                              <!-- Pessoas-->

         
            <img src="five-guys.svg" class="pessoas cinco-pessoas" id="cincoPessoas">
            <img src="one-guy.svg" class="pessoas uma-pessoa" id="umaPessoa">
            <img src="rich-guy.svg" class="pessoas pessoa-rica" id="pessoaRica">
            <img src="mona-lisa.svg" class="pessoas monalisa" id="monalisa">
            <img src="five-guys-sleeping.svg" class="pessoas cinco-dormindo" id="cincodormindo">
            <img src="five-elderly.svg" class="pessoas cinco-idosos" id="idosos">
            <img src="enemy.svg" class="pessoas enemy" id="enemy">
            <img src="cat.svg" class="pessoas cat" id="cat">
            <img src="politic.svg" class="pessoas politic" id="politic">
         </div>

                                <!--Elementos do jogo-->
           <img src="track.svg" class="trilhos">
           <img src="trolley.svg" class="trem">
           <img src="you.svg" class="boneco-alavanca">
           <img src="you (1).svg" class="boneco-alavanca1">

                                <!--Botões de resposta-->

         <div class="botoes" id="botoes">
           <button id="puxar" value="puxou" onclick="virar()">Puxar a alavanca</button>
           <button id="nao-puxar" value="n.puxou" onclick="continuar()">Não puxar</button>
         </div>
         <div class="pergunta" id="pergunta" >
          pergunta teste
         </div>

<div class="pontuação" id="pontos">
   pontuação atual: 
</div>




         <div class="next" id="containerNext">
            <button id="next" value="proxima.p">Next</button>
         </div>

      </div>
     <script src="script.js"></script>
</body>
</html>
