<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConciQuiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
      <div class="cenario">
                                <!-- Tela inicial -->
         <div class="tela-inicial" id="telaInicial">
           <p>Vamos jogar?</p>
           <button id="botaoComecar">Iniciar</button>
         </div>

                                <!--Elementos do jogo-->
           <img src="track.svg" class="trilhos">
           <img src="trolley.svg" class="trem">
           <img src="you (1).svg" class="boneco-alavanca">

                                <!--Botões de resposta-->

         <div class="botoes" id="botoes">
           <button id="puxar" value="puxou" onclick="continuar()">Puxar a alavanca</button>
           <button id="nao-puxar" value="n.puxou" onclick="virar()">Não puxar</button>
         </div>
      </div>
     <script src="script.js"></script>
</body>
</html>
